<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131A22">

<!-- ============================================================
     OG-теги: превью в WhatsApp. Править руками под каждый объект.
     og:image — файл cover.jpg (1200x630) рядом, ПОЛНЫЙ url.
============================================================ -->
<title>סיור תלת־ממד · דירה בנתניה</title>
<meta name="description" content="טיילו בדירה ישירות מהטלפון — סיור תלת־ממדי, כאילו אתם כבר בפנים.">
<meta property="og:type" content="website">
<meta property="og:title" content="סיור תלת־ממד · דירה בנתניה">
<meta property="og:description" content="פתחו וטיילו בדירה מהטלפון — 60 שניות ואתם בפנים.">
<!-- ↓ когда подключится домен bifnim.co.il — замени vercel.app на него в двух строках ↓ -->
<meta property="og:image" content="https://bifnim.vercel.app/cover.jpg">
<meta property="og:url" content="https://bifnim.vercel.app/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#131A22;
  --ink-soft:#1D2733;
  --paper:#F6F4EF;
  --sand:#C7A175;
  --mist:#8E9AA6;
  --line:rgba(246,244,239,.14);
  --wa:#1FAD57;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:'Rubik',system-ui,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
}

header{
  position:fixed;inset:0 0 auto 0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:0 clamp(14px,4vw,40px);height:64px;
  background:linear-gradient(180deg,rgba(19,26,34,.92),rgba(19,26,34,.75));
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.addr{min-width:0}
.addr .eyebrow{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sand);font-weight:500;
}
.addr-btn{
  display:flex;align-items:center;gap:7px;
  background:none;border:0;color:var(--paper);cursor:pointer;
  min-width:0;max-width:100%;padding:0;text-align:start;
}
.addr-btn h1{
  font-family:'Cormorant','Rubik',serif;font-weight:600;
  font-size:clamp(17px,2.4vw,22px);line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-bottom:1px dashed rgba(199,161,117,.55);
}
.addr-btn svg{width:14px;height:14px;fill:var(--sand);flex-shrink:0}
.addr-btn:hover h1{border-bottom-color:var(--sand)}
.addr-btn:focus-visible{outline:2px solid var(--sand);outline-offset:3px;border-radius:4px}
.head-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.agency{display:flex;align-items:center;gap:10px}
.agency img{height:34px;width:auto;border-radius:6px;display:block}
.agency .agency-name{font-size:13px;color:var(--mist);font-weight:400}

.lang{
  appearance:none;-webkit-appearance:none;
  background:rgba(246,244,239,.07);color:var(--paper);
  border:1px solid var(--line);border-radius:20px;
  font-family:'Rubik',sans-serif;font-size:12px;font-weight:400;
  padding:6px 12px;cursor:pointer;
}
.lang:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.lang option{color:#111;background:#fff}

.stage{position:fixed;inset:64px 0 0 0;background:var(--ink-soft)}
.stage iframe{width:100%;height:100%;border:0;display:block}

.curtain{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;text-align:center;padding:24px;
  background:
    radial-gradient(120% 90% at 50% 10%,rgba(199,161,117,.10),transparent 55%),
    var(--ink-soft);
  cursor:pointer;border:0;color:var(--paper);width:100%;
}
.curtain.hidden{display:none}
.curtain .ring{
  width:86px;height:86px;border-radius:50%;
  border:1px solid var(--sand);
  display:grid;place-items:center;
  transition:transform .35s ease, background .35s ease;
}
.curtain:hover .ring,.curtain:focus-visible .ring{
  transform:scale(1.07);background:rgba(199,161,117,.12);
}
.curtain .ring svg{width:30px;height:30px;fill:var(--sand)}
html[dir="ltr"] .curtain .ring svg{margin-left:4px}
html[dir="rtl"] .curtain .ring svg{margin-right:4px;transform:scaleX(-1)}
.curtain .cta-title{
  font-family:'Cormorant','Rubik',serif;
  font-size:clamp(24px,4.5vw,34px);font-weight:500;
}
.curtain .cta-sub{font-size:14px;color:var(--mist);max-width:320px;line-height:1.6}
.curtain:focus-visible{outline:2px solid var(--sand);outline-offset:-6px}

.slate{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:20;
  display:flex;align-items:stretch;
  background:rgba(19,26,34,.88);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  max-width:calc(100% - 24px);
}
.slate .fact{padding:12px 18px;text-align:center;border-inline-end:1px solid var(--line)}
.slate .num{font-size:17px;font-weight:500;letter-spacing:.02em}
.slate .lbl{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mist);margin-top:2px;
}
.slate .wa-btn{
  display:flex;align-items:center;gap:9px;
  padding:12px 20px;background:var(--wa);color:#fff;
  text-decoration:none;font-weight:500;font-size:14px;
  transition:filter .2s ease;
}
.slate .wa-btn:hover{filter:brightness(1.08)}
.slate .wa-btn:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.slate .wa-btn svg{width:18px;height:18px;fill:#fff;flex-shrink:0}
@media (max-width:520px){
  .slate .fact{padding:10px 12px}
  .agency .agency-name{display:none}
  .slate .wa-btn span{display:none}
  .slate .wa-btn{padding:12px 16px}
  /* переключатель языка — полноценная цель для пальца */
  .lang{padding:9px 14px;font-size:13px}
}

/* ---------- Телефон, тур запущен: факты прячутся, остаётся круглая
   WhatsApp-кнопка в углу — не перекрываем управление Matterport ---------- */
@media (max-width:768px){
  body.tour-active .slate{
    left:auto;inset-inline-end:14px;transform:none;
    bottom:calc(14px + env(safe-area-inset-bottom));
    border-radius:50%;
  }
  body.tour-active .slate .fact{display:none}
  body.tour-active .slate .wa-btn{
    padding:0;width:56px;height:56px;border-radius:50%;
    justify-content:center;
  }
  body.tour-active .slate .wa-btn span{display:none}
  body.tour-active .slate .wa-btn svg{width:26px;height:26px}
}

/* ---------- Горизонтальная ориентация: компактная шапка ---------- */
@media (max-height:460px){
  header{height:50px}
  .stage{inset:50px 0 0 0}
  .made{top:calc(50px + 6px);padding:8px 14px;font-size:11px;min-width:110px}
  .addr .eyebrow{display:none}
  .curtain .ring{width:64px;height:64px}
  .curtain{gap:14px}
  .map-card iframe{height:min(62vh,420px)}
}

/* Плашка бренда: прибита к ЛЕВОМУ верхнему углу физически (не зависит от RTL),
   размер с запасом — накрывает водяной знак Matterport в плеере */
.made{
  position:fixed;left:10px;right:auto;top:calc(64px + 6px);z-index:15;
  display:inline-flex;align-items:center;
  font-size:14px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--paper);text-decoration:none;
  background:rgba(19,26,34,.94);padding:14px 26px;border-radius:28px;
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
  box-shadow:0 4px 16px rgba(0,0,0,.35);
  min-width:185px;justify-content:center;
}
.made b{color:var(--sand);font-weight:500}
.made:hover{color:var(--paper)}

/* ---------- Модалка с картой ---------- */
.map-overlay{
  position:fixed;inset:0;z-index:40;
  background:rgba(10,14,19,.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:18px;
}
.map-overlay.open{display:flex}
.map-card{
  width:min(720px,100%);
  background:var(--ink);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
}
.map-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
}
.map-head .map-title{
  font-family:'Cormorant','Rubik',serif;font-size:19px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.map-close{
  background:none;border:0;color:var(--mist);cursor:pointer;
  font-size:26px;line-height:1;padding:2px 8px;border-radius:8px;flex-shrink:0;
}
.map-close:hover{color:var(--paper)}
.map-close:focus-visible{outline:2px solid var(--sand)}
.map-card iframe{width:100%;height:min(52vh,420px);border:0;display:block;background:#e8e6e1}
.map-foot{padding:12px 18px;display:flex;justify-content:flex-end}
.map-open-link{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--sand);text-decoration:none;font-size:14px;font-weight:500;
  border:1px solid rgba(199,161,117,.45);border-radius:24px;padding:9px 18px;
  transition:background .2s ease;
}
.map-open-link:hover{background:rgba(199,161,117,.12)}
.map-open-link svg{width:15px;height:15px;fill:var(--sand)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ============================================================
     КОНФИГ ОБЪЕКТА — правь этот блок (+ OG-теги в head)
============================================================ -->
<script>
const TOUR = {
  matterportId: "uJprx82uPV4",
  address: {                                 // адрес на языках; пустые берут иврит
    he: "דירה בנתניה",
    ru: "Квартира в Нетании",
    en: "Apartment in Netanya",
    fr: "Appartement à Netanya",
    es: "Apartamento en Netanya",
    ar: "شقة في نتانيا"
  },
  mapAddress: "Netanya, Israel",             // адрес для Google Maps, лучше улица+город латиницей или на иврите
  rooms: "4",
  area:  "105",
  floor: "3",
  agencyName: "",
  agencyLogo: "",
  whatsapp: "9725XXXXXXXX",                  // только цифры, с 972
  brandName: "BIFNIM",
  brandUrl:  "https://bifnim.co.il",
  defaultLang: "he"                          // язык по умолчанию
};

/* ---------- Словарь интерфейса.
     Порядок ключей = порядок в переключателе языков. ---------- */
const I18N = {
  he: {dir:"rtl", name:"עברית",
    eyebrow:"סיור תלת־ממד", enter:"להיכנס לדירה",
    sub:"הזיזו את האצבע ועברו בין החדרים — כאילו אתם כבר בפנים",
    rooms:"חדרים", area:'מ"ר', floor:"קומה",
    wa:"לכתוב למתווך", made:"הופק על ידי",
    openMap:"פתיחה בגוגל מפות", close:"סגירה",
    waMsg:"שלום! ראיתי את הסיור התלת־ממדי של הדירה ואשמח לפרטים"},
  en: {dir:"ltr", name:"English",
    eyebrow:"3D Walkthrough", enter:"Step inside",

    rooms:"rooms", area:"m²", floor:"floor",
    wa:"Message the agent", made:"Tour by",
    openMap:"Open in Google Maps", close:"Close",
    waMsg:"Hi! I saw the 3D tour of the apartment and would love more details"},
  ru: {dir:"ltr", name:"Русский",
    eyebrow:"3D-прогулка", enter:"Войти в квартиру",
    sub:"Двигайтесь по комнатам пальцем — как будто вы уже внутри",
    rooms:"комнат", area:"м²", floor:"этаж",
    wa:"Написать маклеру", made:"Тур:",
    openMap:"Открыть в Google Maps", close:"Закрыть",
    waMsg:"Шалом! Видел(а) 3D-тур квартиры, хочу узнать подробнее"},
  ar: {dir:"rtl", name:"العربية",
    eyebrow:"جولة ثلاثية الأبعاد", enter:"ادخل إلى الشقة",
    sub:"حرّك إصبعك للتنقل بين الغرف — وكأنك بالفعل في الداخل",
    rooms:"غرف", area:"م²", floor:"طابق",
    wa:"مراسلة الوكيل", made:"الجولة من",
    openMap:"فتح في خرائط جوجل", close:"إغلاق",
    waMsg:"مرحباً! شاهدت الجولة ثلاثية الأبعاد للشقة وأود المزيد من التفاصيل"},
  fr: {dir:"ltr", name:"Français",
    eyebrow:"Visite 3D", enter:"Entrez dans l'appartement",
    sub:"Glissez pour passer d'une pièce à l'autre — comme si vous y étiez",
    rooms:"pièces", area:"m²", floor:"étage",
    wa:"Écrire à l'agent", made:"Visite par",

    waMsg:"Bonjour ! J'ai vu la visite 3D de l'appartement, je souhaite plus de détails"},

    eyebrow:"Recorrido 3D", enter:"Entra al apartamento",

    openMap:"Abrir en Google Maps", close:"Cerrar",

};
</script>

<header>
  <div class="addr">
    <div class="eyebrow" id="eyebrow"></div>
    <button class="addr-btn" id="addrBtn" type="button">
      <h1 id="addr"></h1>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    </button>
  </div>
  <div class="head-right">
    <div class="agency" id="agency"></div>
    <select class="lang" id="lang" aria-label="Language"></select>
  </div>
</header>

<main class="stage">
  <button class="curtain" id="curtain">
    <span class="ring" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </span>
    <span class="cta-title" id="enter"></span>
    <span class="cta-sub" id="sub"></span>
  </button>
  <iframe id="tour" title="3D tour"
    allow="fullscreen; xr-spatial-tracking"
    allowfullscreen loading="lazy"></iframe>
</main>

<a class="made" id="made" target="_blank" rel="noopener"></a>

<div class="slate" id="slate">
  <div class="fact"><div class="num" id="rooms"></div><div class="lbl" id="roomsLbl"></div></div>
  <div class="fact"><div class="num" id="area"></div><div class="lbl" id="areaLbl"></div></div>
  <div class="fact"><div class="num" id="floor"></div><div class="lbl" id="floorLbl"></div></div>
  <a class="wa-btn" id="wa" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.1.2-.3.2-.6.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4 0-.5.1-.7l.5-.6c.1-.2.1-.4 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2.2-.2 3.9 1 1.9 2.6 3.5 4.6 4.4 2 .9 2.7.8 3.5.7.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.7-.3z"/></svg>
    <span id="waLbl"></span>
  </a>
</div>

<!-- ---------- Модалка с картой ---------- -->
<div class="map-overlay" id="mapOverlay" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
  <div class="map-card">
    <div class="map-head">
      <div class="map-title" id="mapTitle"></div>
      <button class="map-close" id="mapClose" aria-label="Close">×</button>
    </div>
    <iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="map-foot">
      <a class="map-open-link" id="mapLink" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span id="mapLinkLbl"></span>
      </a>
    </div>
  </div>
</div>

<script>
/* ---------- Язык: ВСЕГДА иврит по умолчанию.
   Исключение — явный параметр в ссылке: bifnim.co.il/xxx?lang=ru
   (удобно для адресных рассылок русским/французам). ---------- */
function detectLang(){
  const url = new URLSearchParams(location.search).get('lang');
  if (url && I18N[url]) return url;
  return TOUR.defaultLang;
}

function apply(lang){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;

  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('addr').textContent   = TOUR.address[lang] || TOUR.address[TOUR.defaultLang];
  document.getElementById('enter').textContent  = t.enter;
  document.getElementById('sub').textContent    = t.sub;
  document.getElementById('rooms').textContent  = TOUR.rooms;
  document.getElementById('area').textContent   = TOUR.area;
  document.getElementById('floor').textContent  = TOUR.floor;
  document.getElementById('roomsLbl').textContent = t.rooms;
  document.getElementById('areaLbl').textContent  = t.area;
  document.getElementById('floorLbl').textContent = t.floor;
  document.getElementById('waLbl').textContent    = t.wa;
  document.title = t.eyebrow + " · " + (TOUR.address[lang] || TOUR.address[TOUR.defaultLang]);

  document.getElementById('wa').href =
    "https://wa.me/" + TOUR.whatsapp + "?text=" + encodeURIComponent(t.waMsg);

  const made = document.getElementById('made');
  made.href = TOUR.brandUrl;
  made.innerHTML = t.made + " <b>" + TOUR.brandName + "</b>";

  /* карта: заголовок, ссылка и язык подписей Google */
  document.getElementById('mapTitle').textContent = TOUR.address[lang] || TOUR.address[TOUR.defaultLang];
  document.getElementById('mapLinkLbl').textContent = t.openMap;
  document.getElementById('mapClose').setAttribute('aria-label', t.close);
  const q = encodeURIComponent(TOUR.mapAddress);
  document.getElementById('mapLink').href = "https://www.google.com/maps/search/?api=1&query=" + q;
  mapSrc = "https://www.google.com/maps?q=" + q + "&hl=" + lang + "&z=16&output=embed";
  if (overlay.classList.contains('open')) mapFrame.src = mapSrc;
}

/* ---------- Переключатель ---------- */
const sel = document.getElementById('lang');
for (const code of Object.keys(I18N)){
  const o = document.createElement('option');
  o.value = code; o.textContent = I18N[code].name;
  sel.appendChild(o);
}

/* ---------- Модалка карты ---------- */
const overlay  = document.getElementById('mapOverlay');
const mapFrame = document.getElementById('mapFrame');
let mapSrc = "";

let current = detectLang();
sel.value = current;
apply(current);
sel.addEventListener('change', () => { current = sel.value; apply(current); });

document.getElementById('addrBtn').addEventListener('click', () => {
  if (!mapFrame.src) mapFrame.src = mapSrc;   // карта грузится при первом открытии
  overlay.classList.add('open');
  document.getElementById('mapClose').focus();
});
function closeMap(){
  overlay.classList.remove('open');
  document.getElementById('addrBtn').focus();
}
document.getElementById('mapClose').addEventListener('click', closeMap);
overlay.addEventListener('click', e => { if (e.target === overlay) closeMap(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closeMap();
});

/* ---------- Агентство ---------- */
const agency = document.getElementById('agency');
if (TOUR.agencyLogo){
  const img = document.createElement('img');
  img.src = TOUR.agencyLogo; img.alt = TOUR.agencyName || 'Agency';
  agency.appendChild(img);
}
if (TOUR.agencyName){
  const s = document.createElement('span');
  s.className = 'agency-name'; s.textContent = TOUR.agencyName;
  agency.appendChild(s);
}

/* ---------- Тур по клику ---------- */
const curtain = document.getElementById('curtain');
const frame = document.getElementById('tour');
curtain.addEventListener('click', () => {
  frame.src = "https://my.matterport.com/show/?m=" + TOUR.matterportId + "&play=1&brand=0&title=0&qs=1";
