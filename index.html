<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131A22">

<title>BIFNIM · סיורי תלת־ממד לנדל"ן</title>
<meta name="description" content="סיורים וירטואליים לדירות ונכסים — הלקוח מטייל בנכס מהטלפון, כאילו הוא כבר בפנים.">
<meta property="og:type" content="website">
<meta property="og:title" content="BIFNIM · סיורי תלת־ממד לנדל&quot;ן">
<meta property="og:description" content="כאילו אתם כבר בפנים — סיור וירטואלי בנכס ישירות מהטלפון.">
<meta property="og:image" content="https://bifnim.co.il/cover.jpg">
<meta property="og:url" content="https://bifnim.co.il/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#131A22; --ink-soft:#1D2733; --paper:#F6F4EF;
  --sand:#C7A175; --mist:#8E9AA6; --line:rgba(246,244,239,.14);
  --wa:#1FAD57; --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--ink); color:var(--paper);
  font-family:'Rubik',system-ui,sans-serif; font-weight:300;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* ---------- Герой ---------- */
.hero{
  padding:clamp(56px,12vh,120px) 0 clamp(40px,8vh,72px);
  text-align:center;
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(199,161,117,.12), transparent 60%);
}
.brand{
  font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--sand);font-weight:500;
}
.hero h1{
  font-family:'Cormorant','Rubik',serif;font-weight:600;
  font-size:clamp(34px,6vw,58px);line-height:1.12;
  margin:18px auto 14px;max-width:16ch;
}
.hero p{
  color:var(--mist);font-size:clamp(15px,2vw,18px);
  max-width:44ch;margin:0 auto 30px;line-height:1.7;
}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--wa);color:#fff;text-decoration:none;
  font-weight:500;font-size:16px;
  padding:15px 30px;border-radius:32px;
  transition:filter .2s ease, transform .2s ease;
}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.cta svg{width:20px;height:20px;fill:#fff}

/* ---------- Сетка туров ---------- */
.tours-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin:26px 0 18px;
}
.tours-head h2{
  font-family:'Cormorant','Rubik',serif;font-weight:600;
  font-size:clamp(22px,3.4vw,30px);
}
.tours-head .hint{color:var(--mist);font-size:13px}
.grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  padding-bottom:64px;
}
.card{
  position:relative;display:block;text-decoration:none;color:var(--paper);
  border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);
  background:var(--ink-soft);
  aspect-ratio:4/3;
  transition:transform .25s ease, box-shadow .25s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(0,0,0,.45)}
.card .bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  transition:transform .4s ease;
}
.card:hover .bg{transform:scale(1.04)}
.card .shade{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(19,26,34,.05) 30%,rgba(19,26,34,.88) 100%);
}
.card .info{
  position:absolute;inset-inline:0;bottom:0;padding:16px 18px;
}
.card .title{
  font-family:'Cormorant','Rubik',serif;font-weight:600;
  font-size:20px;line-height:1.2;margin-bottom:6px;
}
.card .facts{color:var(--mist);font-size:13px;letter-spacing:.02em}
.card .badge{
  position:absolute;top:12px;inset-inline-start:12px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:rgba(19,26,34,.75);border:1px solid var(--line);
  padding:6px 12px;border-radius:16px;color:var(--sand);
  backdrop-filter:blur(6px);
}
.empty{
  grid-column:1/-1;text-align:center;color:var(--mist);
  padding:48px 0;font-size:15px;
}

/* ---------- Футер ---------- */
footer{
  border-top:1px solid var(--line);
  padding:26px 0 calc(26px + env(safe-area-inset-bottom));
  text-align:center;color:var(--mist);font-size:13px;
}
footer b{color:var(--sand);font-weight:500;letter-spacing:.18em}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ============================================================
     НАСТРОЙКИ ГЛАВНОЙ: впиши свой WhatsApp (только цифры, с 972).
     Список объектов живёт в tours.json рядом с этим файлом.
============================================================ -->
<script>
const SITE = {
  whatsapp: "972545948101",
  waText: "שלום! אשמח לשמוע פרטים על סיור תלת־ממד לנכס"
};
</script>

<section class="hero">
  <div class="wrap">
    <div class="brand">BIFNIM</div>
    <h1>כאילו אתם כבר בפנים</h1>
    <p>סיורי תלת־ממד לנכסים — הלקוח מטייל בדירה ישירות מהטלפון, מכל מקום בעולם. פחות ביקורי סרק, יותר קונים רציניים.</p>
    <a class="cta" id="cta" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.1.2-.3.2-.6.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4 0-.5.1-.7l.5-.6c.1-.2.1-.4 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2.2-.2 3.9 1 1.9 2.6 3.5 4.6 4.4 2 .9 2.7.8 3.5.7.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.7-.3z"/></svg>
      להזמנת סריקה
    </a>
  </div>
</section>

<section class="wrap">
  <div class="tours-head">
    <h2>נכסים פעילים</h2>
    <span class="hint">לחצו על נכס כדי להיכנס לסיור</span>
  </div>
  <div class="grid" id="grid">
    <div class="empty" id="empty" hidden>בקרוב כאן יופיעו נכסים חדשים</div>
  </div>
</section>

<footer>
  <b>BIFNIM</b> · סיורי תלת־ממד לנדל"ן · נתניה והסביבה
</footer>

<script>
document.getElementById('cta').href =
  "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent(SITE.waText);

/* Объекты подтягиваются из tours.json — простой список рядом с файлом */
fetch('tours.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : [])
  .catch(() => [])
  .then(tours => {
    const grid = document.getElementById('grid');
    if (!Array.isArray(tours) || tours.length === 0){
      document.getElementById('empty').hidden = false;
      return;
    }
    for (const t of tours){
      const a = document.createElement('a');
      a.className = 'card';
      a.href = '/' + t.slug + '/';
      const facts = [
        t.rooms ? t.rooms + ' חדרים' : '',
        t.area  ? t.area + ' מ"ר'   : '',
        t.floor ? 'קומה ' + t.floor : ''
      ].filter(Boolean).join(' · ');
      a.innerHTML =
        '<div class="bg" style="background-image:url(\'/' + t.slug + '/cover.jpg\')"></div>' +
        '<div class="shade"></div>' +
        (t.badge ? '<div class="badge">' + t.badge + '</div>' : '') +
        '<div class="info"><div class="title">' + t.title + '</div>' +
        '<div class="facts">' + facts + '</div></div>';
      grid.appendChild(a);
    }
  });
</script>
</body>
</html>
