<!-- FILE IDENTITY: root index.html — the site landing page (hero + property grid). On GitHub this MUST stay named "index.html" in the repo root. Do not rename there. -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131A22">

<title>BIFNIM · סיורי תלת־ממד לנדל"ן</title>
<meta name="description" content="סיורים וירטואליים לדירות ונכסים — הלקוח מטייל בנכס מהטלפון, כאילו הוא כבר בפנים.">
<meta property="og:type" content="website">
<meta property="og:title" content="BIFNIM · סיורי תלת־ממד לנדל&quot;ן">
<meta property="og:description" content="כאילו אתם כבר בפנים — סיור וירטואלי בנכס ישירות מהטלפון.">
<meta property="og:image" content="https://bifnim.co.il/cover.jpg">
<meta property="og:url" content="https://bifnim.co.il/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#131A22; --ink-soft:#1D2733; --paper:#F6F4EF;
  --sand:#C7A175; --mist:#8E9AA6; --line:rgba(246,244,239,.14);
  --wa:#1FAD57; --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--ink); color:var(--paper);
  font-family:'Rubik',system-ui,sans-serif; font-weight:300;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* ---------- Языковая полоса ---------- */
.langbar{
  border-bottom:1px solid var(--line);
  padding:10px clamp(16px,4vw,40px);
  display:flex;justify-content:center;gap:8px;
}
.langbar button{
  display:inline-flex;align-items:center;gap:7px;
  background:none;border:1px solid transparent;border-radius:20px;
  color:var(--mist);font-family:inherit;font-size:13px;font-weight:400;
  padding:6px 12px;cursor:pointer;
}
.langbar button .flag{font-size:15px;line-height:1}
.langbar button:hover{color:var(--paper)}
.langbar button[aria-pressed="true"]{
  color:var(--sand);border-color:rgba(199,161,117,.4);
  background:rgba(199,161,117,.08);
}
.langbar button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}

/* ---------- Герой ---------- */
.hero{
  padding:clamp(48px,10vh,100px) 0 clamp(40px,8vh,72px);
  text-align:center;
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(199,161,117,.12), transparent 60%);
}
.brand{
  font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--sand);font-weight:500;
}
.hero h1{
  font-family:'Cormorant','Rubik',serif;font-weight:600;
  font-size:clamp(34px,6vw,58px);line-height:1.12;
  margin:18px auto 14px;max-width:16ch;
}
.hero p{
  color:var(--mist);font-size:clamp(15px,2vw,18px);
  max-width:44ch;margin:0 auto 30px;line-height:1.7;
}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--wa);color:#fff;text-decoration:none;
  font-weight:500;font-size:16px;
  padding:15px 30px;border-radius:32px;
  transition:filter .2s ease, transform .2s ease;
}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.cta:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.cta svg{width:20px;height:20px;fill:#fff}

/* ---------- Сетка туров ---------- */
.tours-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin:26px 0 18px;
}
.tours-head h2{
  font-family:'Cormorant','Rubik',serif;font-weight:600;
  font-size:clamp(22px,3.4vw,30px);
}
.tours-head .hint{color:var(--mist);font-size:13px}
.grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  padding-bottom:64px;
}
.card{
  position:relative;display:block;text-decoration:none;color:var(--paper);
  border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);
  background:var(--ink-soft);
  aspect-ratio:4/3;
  transition:transform .25s ease, box-shadow .25s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(0,0,0,.45)}
.card:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
.card .bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  transition:transform .4s ease;
}
.card:hover .bg{transform:scale(1.04)}
.card .shade{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(19,26,34,.05) 30%,rgba(19,26,34,.88) 100%);
}
.card .info{
  position:absolute;inset-inline:0;bottom:0;padding:16px 18px;
}
.card .title{
  font-family:'Cormorant','Rubik',serif;font-weight:600;
  font-size:20px;line-height:1.2;margin-bottom:6px;
}
.card .facts{color:var(--mist);font-size:13px;letter-spacing:.02em}
.card .badge{
  position:absolute;top:12px;inset-inline-start:12px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:rgba(19,26,34,.75);border:1px solid var(--line);
  padding:6px 12px;border-radius:16px;color:var(--sand);
  backdrop-filter:blur(6px);
}
.empty{
  grid-column:1/-1;text-align:center;color:var(--mist);
  padding:48px 0;font-size:15px;
}

/* ---------- Футер ---------- */
footer{
  border-top:1px solid var(--line);
  padding:26px 0 calc(26px + env(safe-area-inset-bottom));
  text-align:center;color:var(--mist);font-size:13px;
}
footer b{color:var(--sand);font-weight:500;letter-spacing:.18em}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ============================================================
     НАСТРОЙКИ ГЛАВНОЙ: номер WhatsApp вписан ниже.
     Список объектов живёт в tours.json рядом с этим файлом.
============================================================ -->
<script>
const SITE = { whatsapp: "972552481623" };

/* ---------- Словарь интерфейса: he (дефолт) / en / fr ----------
   Заголовки карточек (адрес) приходят как есть из tours.json —
   свободный текст адреса автоматически не переводится. Переводятся
   статичная "оболочка" страницы и словарь единиц/статусов карточек. */
const LANG = {
  he: { dir:"rtl", name:"עברית", flag:"🇮🇱",
    h1:"כאילו אתם כבר בפנים",
    sub:"סיורי תלת־ממד לעסק או לנכס שלכם.",
    cta:"להזמנת סריקה",
    waMsg:"שלום! אשמח לשמוע פרטים על סיור תלת־ממד לנכס",
    toursH:"נכסים פעילים", hint:"לחצו על נכס כדי להיכנס לסיור",
    empty:"בקרוב כאן יופיעו נכסים חדשים",
    footer:"סיורי תלת־ממד לנדל\"ן · נתניה והסביבה",
    rooms:"חדרים", area:'מ"ר', floor:"קומה",
    badges:{ "להשכרה":"להשכרה", "למכירה":"למכירה", "הושכר":"הושכר", "לדוגמה":"לדוגמה" },
    langAria:"בחירת שפה"
  },
  en: { dir:"ltr", name:"English", flag:"🇬🇧",
    h1:"As if you're already inside",
    sub:"3D tours for your property or business.",
    cta:"Book a scan",
    waMsg:"Hi! I'd like details about a 3D tour for a property",
    toursH:"Active properties", hint:"Tap a property to enter the tour",
    empty:"New properties coming soon",
    footer:"3D property tours · Netanya & surroundings",
    rooms:"rooms", area:"m²", floor:"floor",
    badges:{ "להשכרה":"For Rent", "למכירה":"For Sale", "הושכר":"Rented", "לדוגמה":"Example" },
    langAria:"Language selection"
  },
  fr: { dir:"ltr", name:"Français", flag:"🇫🇷",
    h1:"Comme si vous y étiez déjà",
    sub:"Visites 3D pour votre bien ou votre entreprise.",
    cta:"Réserver un scan",
    waMsg:"Bonjour ! J'aimerais des détails sur une visite 3D d'un bien",
    toursH:"Biens actifs", hint:"Cliquez sur un bien pour visiter",
    empty:"De nouveaux biens arrivent bientôt",
    footer:"Visites 3D immobilières · Netanya et environs",
    rooms:"pièces", area:"m²", floor:"étage",
    badges:{ "להשכרה":"À louer", "למכירה":"À vendre", "הושכר":"Loué", "לדוגמה":"Exemple" },
    langAria:"Choix de la langue"
  }
};
</script>

<div class="langbar" id="langbar" role="group"></div>

<main>
<section class="hero">
  <div class="wrap">
    <div class="brand">BIFNIM</div>
    <h1 id="h1"></h1>
    <p id="sub"></p>
    <a class="cta" id="cta" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.1.2-.3.2-.6.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4 0-.5.1-.7l.5-.6c.1-.2.1-.4 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2.2-.2 3.9 1 1.9 2.6 3.5 4.6 4.4 2 .9 2.7.8 3.5.7.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.7-.3z"/></svg>
      <span id="ctaLbl"></span>
    </a>
  </div>
</section>

<section class="wrap">
  <div class="tours-head">
    <h2 id="toursH"></h2>
    <span class="hint" id="hint"></span>
  </div>
  <div class="grid" id="grid">
    <div class="empty" id="empty" hidden></div>
  </div>
</section>

</main>

<footer>
  <b>BIFNIM</b> · <span id="footerTxt"></span>
</footer>

<script>
/* ---------- Язык: сохранённый выбор → дефолт he ---------- */
let currentLang = (function(){
  try { const s = localStorage.getItem('bifnim-lang'); if (s && LANG[s]) return s; } catch(e){}
  return 'he';
})();

let toursCache = null; /* объекты запрашиваются один раз, рендер переигрывается при смене языка */

function renderCards(t){
  const grid = document.getElementById('grid');
  grid.querySelectorAll('.card').forEach(el => el.remove());
  const emptyEl = document.getElementById('empty');
  emptyEl.textContent = t.empty;

  if (!Array.isArray(toursCache) || toursCache.length === 0){
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;
  for (const item of toursCache){
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '/' + item.slug + '/';
    const facts = [
      item.rooms ? item.rooms + ' ' + t.rooms : '',
      item.area  ? item.area + ' ' + t.area   : '',
      item.floor ? t.floor + ' ' + item.floor : ''
    ].filter(Boolean).join(' · ');
    const badgeTxt = item.badge ? (t.badges[item.badge] || item.badge) : '';
    a.innerHTML =
      '<div class="bg" style="background-image:url(\'/' + item.slug + '/cover.jpg\')"></div>' +
      '<div class="shade"></div>' +
      (badgeTxt ? '<div class="badge">' + badgeTxt + '</div>' : '') +
      '<div class="info"><div class="title">' + item.title + '</div>' +
      '<div class="facts">' + facts + '</div></div>';
    document.getElementById('grid').appendChild(a);
  }
}

function applyLang(code){
  const t = LANG[code];
  currentLang = code;
  document.documentElement.lang = code;
  document.documentElement.dir = t.dir;

  document.getElementById('h1').textContent = t.h1;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('ctaLbl').textContent = t.cta;
  document.getElementById('toursH').textContent = t.toursH;
  document.getElementById('hint').textContent = t.hint;
  document.getElementById('footerTxt').textContent = t.footer;
  document.title = "BIFNIM · " + t.toursH;

  document.getElementById('cta').href =
    "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent(t.waMsg);

  const bar = document.getElementById('langbar');
  bar.setAttribute('aria-label', t.langAria);
  bar.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.code === code)));

  if (toursCache) renderCards(t);
  try { localStorage.setItem('bifnim-lang', code); } catch(e){}
}

/* ---------- Кнопки языков ---------- */
const bar = document.getElementById('langbar');
Object.keys(LANG).forEach(code => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.code = code;
  b.setAttribute('aria-label', LANG[code].name);
  b.innerHTML = '<span class="flag" aria-hidden="true">' + LANG[code].flag + '</span>' + LANG[code].name;
  b.addEventListener('click', () => applyLang(code));
  bar.appendChild(b);
});

/* ---------- Объекты — один fetch, дальше рендер по языку ---------- */
fetch('tours.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : [])
  .catch(() => [])
  .then(data => { toursCache = Array.isArray(data) ? data : []; applyLang(currentLang); });

applyLang(currentLang); /* немедленный первый рендер шапки, не дожидаясь fetch */
</script>
<script src="/a11y.js" defer></script>
</body>
</html>
